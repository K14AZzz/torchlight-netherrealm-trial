<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>火炬之光无限 · 异界试炼</title>
<style>
:root{
  --gold:#e2b85b; --gold2:#f6e2a4; --ink:#07060b; --panel:#120e18; --hp:#c4453c; --es:#6ee0ef; --mp:#6b8cff; --ok:#8adf7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;height:100dvh;background:#000;overflow:hidden;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:#f3ead6}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#frame{position:relative;width:min(100vw, calc(100dvh * 9 / 16));height:min(100dvh, calc(100vw * 16 / 9));max-width:100%;max-height:100%;background:var(--ink);overflow:hidden;box-shadow:0 0 80px #000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;pointer-events:none;z-index:3}
#hud .top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));}
.stage-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.stage-name{font-size:12px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 8px #000}
.stage-sub{font-size:11px;opacity:.8}
.bars{display:flex;flex-direction:column;gap:3px}
.bar{position:relative;height:11px;background:#1a1218;border:1px solid #3a2a22;overflow:hidden}
.bar.hp{height:14px;border-color:#5a2a28}
.bar i{display:block;height:100%;width:0;transform-origin:left center}
.bar.hp i{background:linear-gradient(180deg,#e2665c,#9d2e28)}
.bar.es i{background:linear-gradient(180deg,#bff6ff,#3db8c9)}
.bar.mp i{background:linear-gradient(180deg,#9db4ff,#3553c9)}
.bar b{position:absolute;inset:0;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px #000;font-weight:600}
.res{display:flex;gap:8px;margin-top:6px;font-size:10px;opacity:.9}
.res span{padding:1px 6px;border:1px solid #3d3428;background:#140f16aa}
.loot-toast{position:absolute;right:12px;top:92px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.loot-toast div{font-size:11px;padding:2px 8px;background:#0008;border-left:2px solid #fff}
button{font-family:inherit;cursor:pointer;appearance:none;background:none}
#frame.menu #hud,#frame.menu #controls{opacity:0;pointer-events:none}
#portalBtn{position:absolute;left:50%;bottom:calc(200px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:none}
#controls{position:absolute;inset:0;z-index:4;pointer-events:none}
#stick{position:absolute;left:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff22;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:#e2b85bcc;box-shadow:0 0 16px #e2b85b55}
.skills{position:absolute;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}
.skill-row{display:flex;gap:10px;align-items:flex-end}
.sk,.flask{width:62px;height:62px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#3a2a20,#120d14 70%);color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 0 12px #000a;font-size:10px;letter-spacing:1px}
.sk.main{width:74px;height:74px}

#eqBar{display:flex;flex-wrap:nowrap;gap:4px;margin-top:6px;pointer-events:auto;overflow-x:auto}
#eqBar .eq{cursor:pointer}
#craftPanel{position:absolute;left:12px;right:12px;top:22%;z-index:7;background:linear-gradient(180deg,#1c1410f2,#0c0a10f5);border:1px solid var(--gold);padding:14px 14px 12px;pointer-events:auto}
#craftPanel.hide{display:none}
#craftPanel h3{color:var(--gold2);font-size:16px;margin-bottom:4px}
#craftPanel .slot{font-size:11px;opacity:.8;margin-bottom:8px}
#craftPanel .aff{font-size:13px;line-height:1.7;margin-bottom:10px;color:#f3ead6}
#craftPanel .row{display:flex;gap:8px;margin-bottom:8px}
#craftPanel .row .btn{flex:1;min-width:0;padding:10px 8px;font-size:13px;letter-spacing:1px}
#craftPanel .row .btn:disabled{opacity:.4}
#craftPanel .gold{font-size:12px;color:var(--gold);margin-bottom:6px}
#craftPanel .hint2{font-size:11px;opacity:.75;line-height:1.5}
#ovGear{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:7;max-height:72%;overflow:auto;background:linear-gradient(180deg,#1c1410f5,#0c0a10f7);border:1px solid var(--gold);padding:12px;pointer-events:auto;text-align:center}
#ovGear.hide{display:none}
#btnGearPage{pointer-events:auto;margin-left:8px;border:1px solid var(--gold);background:#1a120c;color:var(--gold2);font-size:11px;padding:2px 8px;letter-spacing:1px}
#gearStats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;width:min(360px,100%);text-align:left;font-size:12px;margin-bottom:12px}
#gearStats .gs{display:flex;justify-content:space-between;border-bottom:1px solid #3a2a22;padding:3px 0}
#gearStats .gs b{color:var(--gold);font-weight:500}
#gearSlots{width:100%;max-width:360px;text-align:left;max-height:46vh;overflow:auto;margin-bottom:12px}
#gearSlots .gcard{border:1px solid #6a5428;background:#140f18cc;padding:8px 10px;margin-bottom:8px;font-size:12px;line-height:1.55;pointer-events:auto}
#gearSlots .gcard.empty{opacity:.5}
#gearSlots .gcard b{display:block;margin:2px 0 4px}
#gearSlots .uniq,.aff .uniq{color:#ffb347}
#craftPanel .uniq{color:#ffb347}

#craftPanel .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--gold2);font-size:18px;cursor:pointer;pointer-events:auto}
#eqBar .eq{font-size:9px;padding:2px 5px;border:1px solid #3a3428;background:#120e16aa;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#eqBar .eq.empty{opacity:.45}
#ampDock{position:absolute;left:12px;right:12px;bottom:calc(168px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#ampDock .amp-sk{color:var(--gold);font-size:11px;letter-spacing:1px;margin-right:4px;text-shadow:0 1px 4px #000}
#ampDock .chip{border:1px solid #c9a24a;background:#1a120ccc;color:#f6e2a4;font-size:10px;padding:2px 7px;letter-spacing:1px}
#ampDock .chip.syn{border-color:#7ad7ff;color:#9be7ff}
.card .syn{color:#7ad7ff;font-size:11px;margin-top:6px;line-height:1.45}
.sk .gems{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);display:flex;gap:3px;z-index:2}
.sk .gems i{width:7px;height:7px;border-radius:1px;background:#3a2a18;border:1px solid #c9a24a;display:block;transform:rotate(45deg)}
.sk .gems i.on{background:#e2b85b;box-shadow:0 0 6px #e2b85b}
.sk .ampn{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#e2b85b;color:#1a120c;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;z-index:2}
.sk .ampn.show{display:flex}
.card .preview{height:64px;margin:-4px -4px 8px;background:radial-gradient(circle at 50% 60%,#2a1c14,#0a080e);border-bottom:1px solid #3a2a18;overflow:hidden;position:relative}
.card .stat{color:var(--gold2);font-size:12px;margin:4px 0 2px}
.pv{position:absolute;inset:0}
.pv i{position:absolute;border-radius:50%;display:block}
.pv-extra i{width:8px;height:8px;background:#7ad7ff;box-shadow:0 0 8px #7ad7ff;animation:pvshot 1s linear infinite}
.pv-extra i:nth-child(2){animation-delay:.08s;background:#ff8a3a;box-shadow:0 0 8px #ff8a3a}
.pv-extra i:nth-child(3){animation-delay:.16s}
.pv-chain i{width:6px;height:6px;background:#9ad0ff;box-shadow:0 0 10px #9ad0ff;animation:pvchain 0.9s ease-in-out infinite}
.pv-pierce i{width:18px;height:4px;border-radius:2px;background:#f3d37a;animation:pvbeam 0.8s linear infinite}
.pv-area i{width:10px;height:10px;border:2px solid #7ad7ff;background:transparent;left:50%;top:50%;margin:-5px;animation:pvring 1.1s ease-out infinite}
.pv-crit i{width:12px;height:12px;background:#ffe066;left:50%;top:40%;margin:-6px;animation:pvflash .7s ease-in-out infinite}
.pv-speed i{width:7px;height:7px;background:#8adf7a;animation:pvshot .55s linear infinite}
.pv-echo i{width:8px;height:8px;background:#c9b6ff;animation:pvshot 1s linear infinite}
.pv-echo i:nth-child(2){animation-delay:.35s;opacity:.6}
.pv-fire i{width:9px;height:9px;background:#ff8a3a;animation:pvup .9s ease-out infinite}
.pv-cold i{width:9px;height:9px;background:#7ad7ff;animation:pvup .9s ease-out infinite}
.pv-kill i{width:14px;height:14px;border:2px solid #ff8a3a;left:50%;top:50%;margin:-7px;animation:pvring .8s ease-out infinite}
.pv-es i{width:22px;height:22px;border:2px solid #6ee0ef;left:50%;top:50%;margin:-11px;animation:pvring 1.2s linear infinite}
.pv-ms i{width:8px;height:8px;background:#f6e2a4;animation:pvshot .7s linear infinite}
.pv-legend i{width:16px;height:16px;background:#ff8a3a;left:50%;top:45%;margin:-8px;box-shadow:0 0 16px #ff8a3a;animation:pvflash 1s ease-in-out infinite}
@keyframes pvshot{0%{left:12%;top:70%;opacity:0}15%{opacity:1}100%{left:88%;top:22%;opacity:0}}
@keyframes pvchain{0%{left:18%;top:60%}50%{left:50%;top:30%}100%{left:82%;top:55%}}
@keyframes pvbeam{0%{left:8%;top:48%;opacity:0;width:10px}40%{opacity:1;width:70px}100%{left:70%;opacity:0}}
@keyframes pvring{0%{transform:scale(.2);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes pvflash{0%,100%{transform:scale(.7);opacity:.4}50%{transform:scale(1.4);opacity:1}}
@keyframes pvup{0%{left:40%;top:80%;opacity:0}30%{opacity:1}100%{left:55%;top:10%;opacity:0}}
#ovAmp .amp-icon{font-size:42px;margin-bottom:8px;filter:drop-shadow(0 0 16px #e2b85b)}
#ovAmp .amp-now{margin-top:14px;font-size:12px;opacity:.85;line-height:1.7;max-width:320px}

.sk .cd,.flask .cd{position:absolute;inset:2px;border-radius:50%;background:conic-gradient(#000c var(--p,0%),transparent 0);display:none}
.sk.on .cd,.flask.on .cd{display:block}
.sk em,.flask em{font-style:normal;font-size:16px;line-height:1}
.sk small,.flask small{font-size:9px;opacity:.85;margin-top:2px}
.hint{position:absolute;left:0;right:0;bottom:168px;text-align:center;font-size:12px;color:#f6e2a4;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .4s}
.hint.show{opacity:1}
.overlay{position:absolute;inset:0;z-index:6;background:radial-gradient(circle at 50% 30%,#1b1424ee,#07060bf2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center}
.overlay.hide{display:none}
.crest{width:72px;height:72px;border:1px solid var(--gold);transform:rotate(45deg);margin-bottom:22px;box-shadow:0 0 24px #e2b85b55 inset,0 0 40px #e2b85b33;position:relative}
.crest:after{content:"";position:absolute;inset:10px;border:1px solid #f6e2a488}
.kicker{color:var(--gold);letter-spacing:6px;font-size:11px;margin-bottom:8px}
#titleHero{width:168px;height:auto;margin:0 auto 10px;filter:drop-shadow(0 12px 18px #000a);pointer-events:none;display:block}
h1{font-family:"Songti SC","Noto Serif SC",serif;font-size:36px;font-weight:700;color:#f7edd0;text-shadow:0 0 24px #e2b85b55;margin-bottom:6px}
.sub{font-size:13px;opacity:.78;margin-bottom:28px;line-height:1.7}
.btn{pointer-events:auto;border:1px solid var(--gold);background:linear-gradient(#3a2a18,#1a120c);color:var(--gold2);padding:12px 28px;min-width:180px;font-size:15px;letter-spacing:3px;box-shadow:0 0 16px #e2b85b33}
.btn:active{transform:scale(.98);filter:brightness(1.15)}
.heroes{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin:8px 0 18px}
.hero{pointer-events:auto;display:flex;gap:12px;text-align:left;padding:10px;border:1px solid #3a3124;background:#140f18cc}
.hero.sel{border-color:var(--gold);box-shadow:0 0 16px #e2b85b33}
.hero canvas{width:78px;height:118px;background:transparent;flex:none}
.hero .meta b{display:block;color:var(--gold2);font-size:15px;margin-bottom:2px}
.hero .meta p{font-size:11px;opacity:.8;line-height:1.5}
.cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;margin:12px 0}
.card{pointer-events:auto;text-align:left;padding:12px 14px;border:1px solid #6a5428;background:linear-gradient(180deg,#241a12,#100c12);box-shadow:0 0 18px #0008}
.card:active{border-color:var(--gold2)}
.card .tag{font-size:10px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.card b{display:block;font-size:16px;margin-bottom:4px;color:#fff6d8}
.card p{font-size:12px;opacity:.85;line-height:1.55}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:12px 0 22px;font-size:13px;text-align:left;width:min(320px,100%)}
.stats i{font-style:normal;color:var(--gold)}
.muted{opacity:.65;font-size:12px;margin-top:10px}
#bossbar{position:absolute;left:24px;right:24px;top:86px;display:none}
#bossbar .nm{font-size:11px;color:#f0c36a;margin-bottom:3px;text-align:center;letter-spacing:1px}
#bossbar .bar{height:10px;border-color:#6a2420}
#bossbar .bar i{background:linear-gradient(180deg,#ef6a3a,#8d1d18)}
</style>
</head>
<body>
<div id="app"><div id="frame" class="menu">
<canvas id="c"></canvas>
<div id="hud">
  <div class="top">
    <div class="stage-row"><div class="stage-name" id="stageName">异界 · 刻度 I</div><div class="stage-sub" id="runInfo">击杀 0</div><button id="btnGearPage" type="button">装备</button></div>
    <div class="bars">
      <div class="bar es"><i id="esFill"></i><b id="esTxt">能量护盾</b></div>
      <div class="bar hp"><i id="hpFill"></i><b id="hpTxt">生命</b></div>
      <div class="bar mp"><i id="mpFill"></i><b id="mpTxt">法力</b></div>
    </div>
    <div class="res" id="resRow"></div>
    <div id="eqBar"></div>
  </div>
  <div id="bossbar"><div class="nm" id="bossName">异界监视者</div><div class="bar"><i id="bossFill"></i></div></div>
  <div id="ampDock"></div>
  <div class="loot-toast" id="toasts"></div>
  <div class="hint" id="hint"></div>
</div>
<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="skills">
    <div class="skill-row">
      <button class="flask" id="btnFlask"><em>药</em><small>药剂</small><div class="cd"></div></button>
      <button class="sk" id="btnS1"><em>2</em><small>—</small><div class="cd"></div></button>
    </div>
    <div class="skill-row">
      <button class="sk" id="btnS2"><em>3</em><small>—</small><div class="cd"></div></button>
      <button class="sk main" id="btnS0"><em>1</em><small>主技能</small><div class="cd"></div><div class="gems"></div><span class="ampn" id="ampN">0</span></button>
    </div>
  </div>
</div>
<div class="overlay" id="ovTitle">
  <img id="titleHero" alt="hero"/>
  <div class="kicker">TORCHLIGHT INFINITE</div>
  <h1>火炬之光无限</h1>
  <div class="sub">异界试炼 · 肉鸽体验关<br/>选择英雄，链接技能，领取赐福，挑战监视者</div>
  <button class="btn" id="btnStart">开启试炼</button>
  <div class="muted">摇杆或点地移动 · 技能自动锁定 · 1 2 3 / Q 药剂</div>
</div>
<div class="overlay hide" id="ovHero">
  <div class="kicker">选择英雄</div>
  <h1 style="font-size:26px;margin-bottom:8px">英雄特性将决定流派</h1>
  <div class="heroes" id="heroList"></div>
  <button class="btn" id="btnEnter">进入异界</button>
</div>
<div class="overlay hide" id="ovDraft">
  <div class="kicker" id="draftKicker">SKILL AMPLIFY</div>
  <h1 style="font-size:26px" id="draftTitle">选择技能增幅</h1>
  <div class="sub" id="draftSub">增幅会直接改变你的核心技能表现</div>
  <div class="cards" id="draftCards"></div>
</div>
<div class="overlay hide" id="ovAmp">
  <div class="kicker">SKILL AMPLIFIED</div>
  <div class="amp-icon" id="ampIcon">焰</div>
  <h1 style="font-size:26px" id="ampTitle">技能增幅</h1>
  <div class="sub" id="ampDesc"></div>
  <div class="amp-now" id="ampNow"></div>
</div>
<div id="ovGear" class="hide">
  <div class="kicker">CHARACTER SHEET</div>
  <h1 style="font-size:24px;margin-bottom:10px">装备与属性</h1>
  <div id="gearStats"></div>
  <div id="gearSlots"></div>
  <button class="btn" id="gearClose">返回</button>
</div>
<div class="overlay hide" id="ovResult">
  <div class="kicker" id="resKicker">RUN COMPLETE</div>
  <h1 style="font-size:28px" id="resTitle">异界已净化</h1>
  <div class="sub" id="resSub"></div>
  <div class="stats" id="resStats"></div>
  <button class="btn" id="btnAgain">再次试炼</button>
</div>
<button class="btn" id="portalBtn">进入传送门</button>
<div id="craftPanel" class="hide">
  <button class="x" id="crClose">×</button>
  <div class="kicker" style="margin-bottom:6px">GEAR FORGE</div>
  <h3 id="crName">装备</h3>
  <div class="slot" id="crSlot"></div>
  <div class="aff" id="crAff"></div>
  <div class="gold" id="crGold">金币 0</div>
  <div class="row">
    <button class="btn" id="crUp">强化</button>
    <button class="btn" id="crRoll">洗练</button>
  </div>
  <button class="btn" id="crAwake" style="display:none;width:100%;margin-bottom:8px">觉醒</button>
  <div class="hint2" id="crHint"></div>
</div>
</div></div>
<script>


(() => {
const canvas = document.getElementById("c");

const clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
const lerp = function(a,b,t){ return a + (b-a)*t; };
const rand = function(a,b){ return a + Math.random()*(b-a); };
const irand = function(a,b){ return (Math.random()*(b-a+1)+a)|0; };
const pick = function(a){ return a[(Math.random()*a.length)|0]; };
const ang = function(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); };
const dist = function(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); };
const vlen = function(x,y){ return Math.hypot(x,y)||1; };

function hexRgb(h){
  h = h.replace("#","");
  if(h.length===3) h = h.split("").map(function(c){return c+c;}).join("");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

let actx = null;
function ensureAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!actx) actx = new AC();
  if(actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol, slide){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t+dur);
  g.gain.setValueAtTime(vol||0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(vol, dur){
  if(!actx) return;
  const n = actx.createBuffer(1, Math.max(1, actx.sampleRate*dur), actx.sampleRate);
  const d = n.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1-i/d.length);
  const s = actx.createBufferSource(); s.buffer = n;
  const g = actx.createGain(); g.gain.value = vol||0.04;
  const f = actx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
}

const keys = {};
const stick = {x:0, y:0, active:false};
window.addEventListener("keydown", function(e){
  keys[e.key.toLowerCase()] = true;
  const k = e.key.toLowerCase();
  if(k===" " || k.indexOf("arrow")===0) e.preventDefault();
  if(e.key==="1") castSlot(0);
  if(e.key==="2") castSlot(1);
  if(e.key==="3") castSlot(2);
  if(k==="q" || k==="e") useFlask();
});
window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()] = false; });

function bindStick(){
  function set(cx, cy){
    const r = stickEl.getBoundingClientRect();
    const x = cx - r.left - r.width/2;
    const y = cy - r.top - r.height/2;
    const m = Math.min(r.width*0.38, Math.hypot(x,y));
    const a = Math.atan2(y,x);
    stick.x = Math.cos(a) * (m / (r.width*0.38));
    stick.y = Math.sin(a) * (m / (r.width*0.38));
    knobEl.style.left = (r.width/2 + Math.cos(a)*m - 25) + "px";
    knobEl.style.top = (r.height/2 + Math.sin(a)*m - 25) + "px";
  }
  function end(){ stick.x=0; stick.y=0; stick.active=false; knobEl.style.left="39px"; knobEl.style.top="39px"; }
  stickEl.addEventListener("pointerdown", function(e){ stick.active=true; stickEl.setPointerCapture(e.pointerId); set(e.clientX,e.clientY); });
  stickEl.addEventListener("pointermove", function(e){ if(stick.active) set(e.clientX,e.clientY); });
  stickEl.addEventListener("pointerup", end);
  stickEl.addEventListener("pointercancel", end);
}
bindStick();
canvas.style.touchAction="none";
canvas.addEventListener("pointerdown", function(e){
  if(G.state!=="play" || G.paused) return;
  if(e.target!==canvas) return;
  const r=canvas.getBoundingClientRect();
  const lx=(e.clientX-r.left)/r.width*W;
  const ly=(e.clientY-r.top)/r.height*H;
  G.moveTarget={x:lx+G.cam.x, y:ly+G.cam.y};
});

function hasAmp(id){ return G.chosen.some(function(c){ return c.id===id; }); }
function hasPair(a,b){ return hasAmp(a) && hasAmp(b); }
function activeSynergies(){ return SYNERGIES.filter(function(s){ return hasPair(s.a,s.b); }); }
function synergiesIfPick(card){
  const ids=G.chosen.map(function(c){ return c.id; }).concat([card.id]);
  return SYNERGIES.filter(function(s){
    const hasA=ids.indexOf(s.a)>=0, hasB=ids.indexOf(s.b)>=0;
    if(!(hasA&&hasB)) return false;
    if(s.a!==card.id && s.b!==card.id) return false;
    return !(hasAmp(s.a)&&hasAmp(s.b));
  });
}
function synReady(key, cd){
  const p=G.player; if(!p.synCd) p.synCd={};
  if((p.synCd[key]||0)>G.time) return false;
  p.synCd[key]=G.time+cd; return true;
}
function frostBurst(x,y,scale){
  scale=scale||1; const p=G.player;
  radiusDamage(x,y, 58*p.mods.area*scale, 22*p.mods.more*scale, {cold:true, syn:true});
  addRing(x,y, 66*p.mods.area*scale, "#7ad7ff", 0.3, 3);
  burst(x,y,"#7ad7ff", 12, 150, 4);
}
function fireBurst(x,y,scale){
  scale=scale||1; const p=G.player;
  radiusDamage(x,y, 58*p.mods.area*scale, 22*p.mods.more*scale, {fire:true, syn:true});
  addRing(x,y, 66*p.mods.area*scale, "#ff8a3a", 0.3, 3);
  burst(x,y,"#ff8a3a", 12, 160, 4);
}
function applySynergyBonuses(){
  const p=G.player; if(!p.synBonus) p.synBonus={};
  if(hasPair("speed","cdr") && !p.synBonus.speedCdr){ p.synBonus.speedCdr=true; p.mods.atkSpd+=0.15; p.mods.cdr=Math.min(0.5, p.mods.cdr+0.1); }
  if(hasPair("echo","time") && !p.synBonus.echoTime){ p.synBonus.echoTime=true; p.mods.echo=Math.max(p.mods.echo,0.75); }
}
function triggerHitSyn(e, dmg, opt, crit){
  const p=G.player; if(!p || opt.syn) return;
    if(hasPair("chill","chain") && opt.chainJump) frostBurst(e.x, e.y, 0.9);
  if(hasPair("ignite","chain") && opt.chainJump) fireBurst(e.x, e.y, 0.9);
  if(hasPair("chill","extra") && opt.proj && synReady("frostExtra",0.12)) frostBurst(e.x, e.y, 0.55);
  if(hasPair("chill","pierce") && opt.proj && (p.mods.pierce>0) && synReady("frostPierce",0.08)){
    G.grounds.push({x:e.x,y:e.y,r:26*p.mods.area,t:0,life:1.4,dmg:8,k:0,cold:true});
  }
  if(hasPair("ignite","ember") && (opt.fire||p.mods.ignite) && synReady("spreadIgnite",0.25)){
    G.grounds.push({x:e.x,y:e.y,r:42*p.mods.area,t:0,life:1.8,dmg:14,k:0});
    const n=nearestEnemy(e, 140);
    if(n && n!==e) n.burn=Math.max(n.burn, 1.8);
  }
  if(crit && hasPair("crit","spark") && synReady("critSpark",0.18)){
    radiusDamage(e.x,e.y, 70*p.mods.area, dmg*0.45, {light:true, syn:true});
    addRing(e.x,e.y,70*p.mods.area,"#ffe066",0.25,3);
  }
  if(hasPair("added","chill") && synReady("addedChill",0.22)) frostBurst(e.x,e.y,0.7);
  if(hasPair("added","ignite") && synReady("addedIgnite",0.28)){
    frostBurst(e.x,e.y,0.6); fireBurst(e.x,e.y,0.6);
    addRing(e.x,e.y,80*p.mods.area,"#c9b6ff",0.3,3);
  }
  if(hasPair("esOnHit","fortress") && p.es>=p.maxes-0.5 && synReady("esFort",0.4)){
    frostBurst(p.x,p.y,0.8); p.es=Math.min(p.maxes, p.es+8);
  }
  if(p.mods.execute && e.hp<e.maxhp*0.25 && hasPair("leech","overkill")){
    p.hp=Math.min(p.maxhp, p.hp+p.maxhp*0.06);
    addFloat(p.x,p.y-24,"猎杀","#8adf7a");
  }
}

function spawnWorld(){
  G.props=[]; G.decos=[];
  const spots=[];
  function trySpot(minP){
    minP=minP||160;
    for(let n=0;n<50;n++){
      const x=rand(130,G.roomW-130), y=rand(140,G.roomH-140);
      if(wallAt(x,y,26) || dist({x:x,y:y},G.player)<minP) continue;
      let ok=true;
      for(let i=0;i<spots.length;i++){ if(Math.hypot(spots[i].x-x,spots[i].y-y)<78){ ok=false; break; } }
      if(!ok) continue;
      spots.push({x:x,y:y}); return {x:x,y:y};
    }
    return null;
  }
  const barrels=6+G.room*2;
  for(let i=0;i<barrels;i++){ const s=trySpot(); if(s) G.props.push({kind:"barrel",x:s.x,y:s.y,r:16,hp:16,maxhp:16,t:rand(0,10)}); }
  const chests=2+(G.room>=2?1:0);
  for(let i=0;i<chests;i++){ const s=trySpot(200); if(s) G.props.push({kind:"chest",x:s.x,y:s.y,r:18,closed:true,t:0}); }
  for(let i=0;i<3;i++){ const s=trySpot(); if(s) G.props.push({kind:"urn",x:s.x,y:s.y,r:14,hp:10,maxhp:10,t:rand(0,8)}); }
  const sh=trySpot(220); if(sh) G.props.push({kind:"shrine",x:sh.x,y:sh.y,r:22,used:false,t:0});
  for(let i=0;i<6+G.room;i++){ const s=trySpot(100); if(s) G.loots.push({kind:"gold",x:s.x,y:s.y,v:irand(4,10),vy:0,t:0,dead:false,keep:true,pile:true}); }
  for(let i=0;i<2;i++){ const s=trySpot(140); if(s) G.loots.push({kind:"potion",x:s.x,y:s.y,t:0,dead:false,keep:true,vy:0}); }
  const it=trySpot(160); if(it) G.loots.push({kind:"item",x:it.x,y:it.y,rar:pick(["white","blue"]),name:itemName(pick(["white","blue"])),t:0,vy:0,dead:false,keep:true});
  for(let i=0;i<18;i++){
    const x=rand(80,G.roomW-80), y=rand(80,G.roomH-80);
    if(wallAt(x,y,12)) continue;
    G.decos.push({kind:pick(["rune","bones","crack","ember"]),x:x,y:y,a:rand(0,6.28),s:rand(0.8,1.4)});
  }
}

    if(d.kind==="rune"){
      ctx.strokeStyle="rgba(226,184,91,0.22)"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(0,0,12*(d.s||1),0,6.28); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke();

const SLOT_BIAS={weapon:["more","crit","atkSpd","addFire","addCold","addLight"],chest:["hp","es","more"],boots:["move","atkSpd","es"],ring:["crit","critMul","leech"],amulet:["es","more","cdr","area"]};
function rarRank(r){ return {white:1,blue:2,yellow:3,orange:4}[r]||1; }
function rollAffix(slot, rar, ilvl){
  const bias=SLOT_BIAS[slot]||[];
  const n={white:1,blue:2,yellow:3,orange:4}[rar]||1;
  const used={}, out=[];
  function pickA(){
    const pool=AFFIX_POOL.filter(function(a){ return !used[a.stat]; });
    if(!pool.length) return null;
    let sum=0; const w=pool.map(function(a){ const x=a.w+(bias.indexOf(a.stat)>=0?4:0); sum+=x; return x; });
    let t=Math.random()*sum;
    for(let i=0;i<pool.length;i++){ t-=w[i]; if(t<=0) return pool[i]; }
    return pool[0];
  }
  for(let k=0;k<n;k++){
    const a=pickA(); if(!a) break; used[a.stat]=true;
    const t=0.35+0.65*Math.random();
    let v=a.min+(a.max-a.min)*t;
    v*=1+ilvl*0.18;
    if(a.kind==="flat") v=Math.round(v);
    else v=Math.round(v*1000)/1000;
    const txt=a.kind==="flat" ? (a.label+" +"+v) : (a.label+" +"+Math.round(v*100)+"%");
    out.push({stat:a.stat, value:v, text:txt});

}
function gearScore(it){
  let s=rarRank(it.rar)*40 + (it.ilvl||0)*8;
  it.affixes.forEach(function(a){
    if(a.stat==="more") s+=a.value*220;
    else if(a.stat==="crit") s+=a.value*160;
    else if(a.stat==="critMul") s+=a.value*70;
    else if(a.stat==="atkSpd") s+=a.value*90;
    else if(a.stat==="hp") s+=a.value*0.9;
    else if(a.stat==="es") s+=a.value*0.7;
    else if(a.stat==="move") s+=a.value*50;
    else if(a.stat.indexOf("add")===0) s+=a.value*1.2;
    else if(a.stat==="area") s+=a.value*80;
    else if(a.stat==="cdr") s+=a.value*70;
    else if(a.stat==="leech") s+=a.value*120;
  });
  return Math.round(s);
}
function makeGear(slot, rar, ilvl){
  rar=rar||"white"; ilvl=ilvl||0; slot=slot||pick(SLOTS);
  const names=GEAR_NAMES[slot][rar]||GEAR_NAMES[slot].white;
  const it={kind:"gear", slot:slot, rar:rar, ilvl:ilvl, plus:0, name:pick(names), affixes:rollAffix(slot,rar,ilvl)};
  it.score=gearScore(it);

function gearApply(it, sign){
  const p=G.player; if(!it) return;
  function one(a){
    if(!a || a.flag) return;
    const v=a.value, s=sign; if(v==null) return;
    if(a.stat==="hp"){ p.maxhp+=s*v; if(s>0) p.hp+=v; else p.hp=Math.min(p.hp,p.maxhp); }
    else if(a.stat==="es"){ p.maxes+=s*v; if(s>0) p.es+=v; else p.es=Math.min(p.es,p.maxes); }
    else if(a.stat==="more") p.mods.more *= s>0 ? (1+v) : (1/(1+v));
    else if(a.stat==="atkSpd") p.mods.atkSpd += s*v;
    else if(a.stat==="move") p.mods.move += s*v;
    else if(a.stat==="area") p.mods.area += s*v;
    else if(a.stat==="cdr") p.mods.cdr = Math.max(0, p.mods.cdr + s*v);
    else if(a.stat==="leech") p.mods.leech += s*v;
    else if(a.stat==="crit") p.mods.crit += s*v;
    else if(a.stat==="critMul") p.mods.critMul += s*v;
    else if(a.stat==="addFire") p.mods.addFire += s*v;
    else if(a.stat==="addCold") p.mods.addCold += s*v;
    else if(a.stat==="addLight") p.mods.addLight += s*v;
    else if(a.stat==="proj") p.mods.proj += s*v;
    else if(a.stat==="chain") p.mods.chain += s*v;

  rebuildAwaken();
}

  const cand=rollAffix(it.slot, it.rar, it.ilvl||0);

function upgradeGear(){
  const it=G.player.gear[G.craftSlot]; if(!it) return;
  if((it.plus||0)>=8){ toast("已达强化上限","#c9a24a"); return; }
  const cost=upgradeCost(it);
  if(G.gold<cost){ toast("金币不足","#c9a24a"); return; }
  G.gold-=cost;
  gearApply(it,-1);
  it.plus=(it.plus||0)+1;
  it.ilvl=(it.ilvl||0)+1;
  it.affixes.forEach(function(a){
    if(a.stat==="hp"||a.stat==="es"||a.stat.indexOf("add")===0) a.value=Math.max(a.value+1, Math.round(a.value*1.14));
    else a.value=Math.round(a.value*1.14*1000)/1000;
    a.text=affixText(a.stat, a.value);
  });
  if((it.plus===3||it.plus===6) && it.affixes.length<5){
    if(addOneAffix(it)) toast("额外词条出现","#ffe066");
  }
  it.score=gearScore(it);
  gearApply(it,1);
  renderCraft(G.craftSlot); refreshEq(); refreshHud();

function rebuildAwaken(){

  p.aw={};
  SLOTS.forEach(function(s){
    const it=p.gear&&p.gear[s];
    (it&&it.awaken||[]).forEach(function(a){ if(a.flag) p.aw[a.flag]=true; });
  });

function pickAwakenAff(slot, n, used){
  used=used||{};
  const pool=(AWAKEN_POOL[slot]||[]).filter(function(a){ return !used[a.id]; });
  const copy=pool.slice();
  const out=[];
  while(out.length<n && copy.length){
    const i=irand(0,copy.length-1);
    out.push(copy.splice(i,1)[0]);
    used[out[out.length-1].id]=true;
  }
  return out.map(function(a){ return Object.assign({}, a); });
}

function buildRoom(){
  G.walls=[]; G.torches=[]; G.grounds=[]; G.portal=null; G.cleared=false;
  const w=G.roomW, h=G.roomH, t=40;
  G.walls.push({x:0,y:0,w:w,h:t},{x:0,y:h-t,w:w,h:t},{x:0,y:0,w:t,h:h},{x:w-t,y:0,w:t,h:h});
  const pillars = [[260,300],[w-300,320],[280,h-340],[w-280,h-300],[w/2-260,h/2+160],[w/2+280,h/2+140]];
  pillars.forEach(function(pt,i){
    const s = 54;
    G.walls.push({x:pt[0]-s/2,y:pt[1]-s/2,w:s,h:s,pillar:true});
    G.torches.push({x:pt[0]-s/2-6,y:pt[1], t:rand(0,10)});
    G.torches.push({x:pt[0]+s/2+6,y:pt[1], t:rand(0,10)});
  });
  G.player.x=w/2; G.player.y=h-220;
  G.pet.x=G.player.x-40; G.pet.y=G.player.y+10;
  G.cam.x=G.player.x-W/2; G.cam.y=G.player.y-H*0.62;
  G.enemies=[]; G.bullets=[]; G.loots=[]; G.props=[]; G.decos=[]; G.spawnQueue=[]; G.wave=0; G.echoes=[];
  queueWave();
}
function queueWave(){
  const room = ROOMS[G.room];
  const wave = room.waves[G.wave];
  if(!wave){ openPortal(); return; }
  G.spawnQueue=[];
  wave.forEach(function(pair){ for(let i=0;i<pair[1];i++) G.spawnQueue.push(pair[0]); });
  G.spawnT=0.12;
  hint(G.room===3 ? "监视者降临" : ("第 " + (G.wave+1) + " 波敌人"), 1.6);
}
function spawnEnemy(type, x, y){

function spawnAround(type){
  const p=G.player; let x=p.x, y=p.y, ok=false, n=0;
  while(!ok && n++<40){
    const a=rand(0,Math.PI*2), r=rand(130,280);
    x=clamp(p.x+Math.cos(a)*r, 90, G.roomW-90);
    y=clamp(p.y+Math.sin(a)*r, 90, G.roomH-90);
    ok = dist({x:x,y:y}, p)>110 && !wallAt(x,y,18);
  }
  spawnEnemy(type,x,y);
}
function openPortal(){
  G.cleared=true;
  G.portal={x:clamp(G.player.x, 120, G.roomW-120), y:clamp(G.player.y-110, 120, G.roomH-120), r:46, t:0};
  $("portalBtn").style.display="block";
  hint(G.room===3 ? "试炼完成" : "房间肃清", 1.6);
  beep(520,0.2,"sine",0.06,880);
}
function wallAt(x,y,r){
  for(let i=0;i<G.walls.length;i++){
    const w=G.walls[i];
    const nx=clamp(x,w.x,w.x+w.w), ny=clamp(y,w.y,w.y+w.h);
    if(Math.hypot(x-nx,y-ny)<r) return w;
  }
  return null;
}
function separateWall(e){
  const w=wallAt(e.x,e.y,e.r); if(!w) return;
  const nx=clamp(e.x,w.x,w.x+w.w), ny=clamp(e.y,w.y,w.y+w.h);
  let dx=e.x-nx, dy=e.y-ny, l=Math.hypot(dx,dy)||1;
  if(l<e.r){ const k=(e.r-l+0.5)/l; e.x+=dx*k; e.y+=dy*k; }
}

function nearestEnemy(from, maxd){
  let best=null, bd=maxd||1e9;
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i]; if(e.dead) continue;
    const d=dist(from,e); if(d<bd){ bd=d; best=e; }
  }
  return best;
}

function burst(x,y,color,n,spd,size){

  }
}
function sparkLine(x,y,x2,y2,color){ G.particles.push({line:true,x:x,y:y,x2:x2,y2:y2,color:color,t:0,life:0.12}); }

function dealPlayerHit(e, dmg){
  const p=G.player;
  if(p.invuln>0 || p.dead) return;
  if(p.es>0){ const absorb=Math.min(p.es,dmg); p.es-=absorb; dmg-=absorb; }
  if(dmg>0) p.hp-=dmg;
  p.esDelay=2.6; p.hitT=0.15; G.shake=Math.max(G.shake,7); G.flash=0.12;
  noiseHit(0.05,0.08);
  if(p.hp<=0){ p.hp=0; p.dead=true; onDeath(); }
}
function onKill(e){
  G.kills++; G.combo++; G.comboT=2.2; G.maxCombo=Math.max(G.maxCombo,G.combo);
  burst(e.x,e.y,e.color, e.elite?28:12, e.elite?260:160, e.elite?7:4);
  dropLoot(e);
  const p=G.player;
  if(p.aw && p.aw.killEs) p.es=Math.min(p.maxes, p.es+p.maxes*0.08);
  if(p.mods.onKillNova){
    const big=hasPair("novaKill","area")||hasPair("ignite","novaKill");
    const R=70*p.mods.area*(big?1.7:1);
    const d=22*p.mods.more*(hasPair("ignite","novaKill")?1.6:1);
    radiusDamage(e.x,e.y, R, d, {fire:true, syn:true});
    if(big) addRing(e.x,e.y,R,"#ff8a3a",0.35,4);
  }
  if(hasPair("chill","chain") && synReady("killFrost",0.05)) frostBurst(e.x,e.y,1.1);
}
function dropLoot(e){
  const n = e.type==="boss"? irand(10,16) : e.elite? irand(5,8) : irand(2,5);
  for(let i=0;i<n;i++){
    const a=rand(0,6.28), r=rand(10,40);
    G.loots.push({kind:"gold", x:e.x+Math.cos(a)*r, y:e.y+Math.sin(a)*r, v:irand(e.gold[0],e.gold[1]+2), vy:-rand(40,90), t:0, dead:false, keep:true});
  }
  const drops = e.type==="boss"?2 : e.elite?(Math.random()<0.9?1:0) : (Math.random()<0.38?1:0);
  for(let g=0;g<drops;g++){
    const rar = e.type==="boss"? pick(["yellow","orange","orange"]) : e.elite? pick(["blue","yellow","yellow","orange"]) : pick(["white","white","blue","blue"]);
    const it=makeGear(pick(SLOTS), rar, G.room+(e.elite?1:0)+(e.type==="boss"?2:0));
    G.loots.push({kind:"item", x:e.x+rand(-12,12), y:e.y+rand(-8,8), rar:it.rar, name:it.name, item:it, t:0, vy:-40, dead:false, keep:true});
  }
  if(e.elite || Math.random()<0.25) G.loots.push({kind:"potion",x:e.x+12,y:e.y-8,t:0,vy:-24,dead:false,keep:true});
}

function radiusDamage(x,y,r,base,opt){
  opt=opt||{};
  const st=G.player?vfx():{cols:["#f0d48a"],size:1};
  const col=opt.fire?st.cols[0]: opt.cold?(st.cols[1]||st.cols[0]):st.cols[0];
  burst(x,y, col, 14+Math.floor(8*st.size), 180*st.size, 4+st.size*2);
  addRing(x,y,r,col,0.3,3);
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(!e.dead && Math.hypot(e.x-x,e.y-y)<=r+e.r) hitEnemy(e, base, opt);
  }
  }

function hitEnemy(e, base, opt){
  const p=G.player; opt=opt||{};
  let dmg = base * p.mods.more;
  if(opt.fire) dmg = dmg*p.mods.fireMore + p.mods.addFire;
  if(opt.cold) dmg = dmg*p.mods.coldMore + p.mods.addCold;
  if(opt.light) dmg = dmg*p.mods.lightMore + p.mods.addLight;
  if(opt.phys) dmg += (p.mods.addFire+p.mods.addCold+p.mods.addLight)*0.35;
  if(p.mods.execute && e.hp<e.maxhp*0.25) dmg*=1.8;
  const crit = Math.random() < p.mods.crit + (e.mark>0?0.15:0);
  if(crit) dmg *= p.mods.critMul;
  dmg = Math.round(dmg * rand(0.92,1.08));
  if(p.aw && p.aw.lowHp && p.hp<p.maxhp*0.4) dmg=Math.round(dmg*1.25);
  e.hp-=dmg; e.hit=0.12; G.dmgDone+=dmg;
  if(p.mods.esOnHit) p.es=Math.min(p.maxes, p.es+p.mods.esOnHit);
  if(p.mods.leech) p.hp=Math.min(p.maxhp, p.hp+dmg*p.mods.leech);
  if(p.mods.chill || opt.cold) e.chill=1.6;
  if(p.mods.ignite || opt.fire || (p.aw&&p.aw.awIgnite)) e.burn=Math.max(e.burn, 2.2);
  if(p.aw&&p.aw.hitMp) p.mp=Math.min(p.maxmp, p.mp+3);
  if(p.hero.trait==="mark" && opt.proj) e.mark=3.5;
  if(p.hero.trait==="rage") p.trait=Math.min(p.traitMax, p.trait+(crit?12:6));
  if(p.hero.trait==="fusion" && (opt.fire||opt.cold)){
    p.trait=Math.min(p.traitMax, p.trait+1);
    if(p.trait>=p.traitMax){ p.trait=0; radiusDamage(e.x,e.y, 92*p.mods.area, 48, {fire:true,cold:true,syn:true}); }
  }
  if(crit && p.aw && p.aw.critFrost && !opt.syn && synReady("awFrost",0.22)) frostBurst(e.x,e.y,0.85);
  if(crit && p.aw && p.aw.awSpark && !opt.syn){
    const ns=nearestEnemy(e, 280);
    if(ns && ns!==e){ sparkLine(e.x,e.y,ns.x,ns.y,"#ffe066"); hitEnemy(ns, dmg*0.5, {light:true, syn:true}); }
  }
  if(crit && p.mods.spark){
    const n=nearestEnemy(e, 260);
    if(n && n!==e){ sparkLine(e.x,e.y,n.x,n.y,"#9ad0ff"); hitEnemy(n, dmg*0.55, {light:true, syn:true}); }
  }
  addFloat(e.x, e.y-20, String(dmg), crit?"#ffdd77":(opt.fire?"#ff9a55":opt.cold?"#9be7ff":"#fff"), crit);
  e.lastCrit=crit;
  if(!opt.syn) triggerHitSyn(e, dmg, opt, crit);
  if(e.hp<=0){ e.dead=true; onKill(e); }
  if(p.hero.trait==="rage" && p.trait>=p.traitMax && opt.melee){
    p.trait=0; radiusDamage(p.x,p.y, 110*p.mods.area, 70, {phys:true,fire:true}); G.shake=10;
  }
}
function spawnProj(opt){
  const st=G.player?vfx():{size:1,chain:0,pierce:0};

  });
}

function skillBase(id){
  const map={ frostbolt:17, nova:34, blink:22, cleave:22, whirl:14, leap:36, spear:15, rain:12, roll:0 };
  return (map[id]||16) * (1+G.room*0.06);
}
function later(fn, ms){ G.echoes.push({t:ms/1000, fn:fn}); }
function castSkill(id){
  const p=G.player;
  if(p.dead || G.paused) return false;
  const sk=SKILLS[id]; if(!sk) return false;
  if(p.mp<sk.mana){ toast("法力不足","#6b8cff"); return false; }
  p.mp-=sk.mana;
  const tgt=nearestEnemy(p,560);
  let a=p.facing; if(tgt) a=ang(p,tgt); p.facing=a;
  doCast(id,a,tgt);
  if(Math.random()<p.mods.echo) later(function(){ if(!p.dead) doCast(id,a,nearestEnemy(p,560)); }, 80);
  if(p.mods.delayEcho) later(function(){ if(!p.dead) doCast(id,a,nearestEnemy(p,560)); }, 350);
  if(hasPair("echo","time")) later(function(){ if(!p.dead) doCast(id,a,nearestEnemy(p,560)); }, 180);
  return true;
}
function doCast(id,a,tgt){
  const p=G.player, base=skillBase(id)*(p.aw&&p.aw.moveDmg&&p.moving?1.2:1), n=p.mods.proj, st=vfx();
  p.attackT=p.attackMax; p.didSlash=false;
  if(id==="frostbolt" || id==="spear"){
    const sp = id==="spear"?620:520;
    for(let i=0;i<n;i++){
      const spread=(i-(n-1)/2)* (0.10+0.04*n), aa=a+spread;
      const col = st.cols[i%st.cols.length];
      spawnProj({
        x:p.x+Math.cos(aa)*22, y:p.y+Math.sin(aa)*22, vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp,
        r:id==="spear"?6:8, dmg:base, pierce:p.mods.pierce+(id==="spear"?2:0), chain:p.mods.chain,
        color:col,
        opt:{proj:true, fire:id==="frostbolt"||p.mods.addFire>0||p.mods.ignite, cold:id==="frostbolt"||p.mods.addCold>0||p.mods.chill, light:id==="spear"||p.mods.addLight>0||p.mods.spark, phys:id==="spear"}
      });
    }
    muzzle(p.x+Math.cos(a)*24, p.y+Math.sin(a)*24, a, st.cols[0]);
    beep(id==="spear"?420:360, 0.06, "square", 0.03, 180);
  } else if(id==="nova"){
    const R=130*st.area;
    radiusDamage(p.x,p.y,R, base, {cold:true, fire:p.mods.ignite||p.mods.addFire>0});
    st.cols.forEach(function(c,i){ addRing(p.x,p.y, R*(0.7+i*0.18), c, 0.42, 3+i); });
    if(hasPair("chill","area")){ addRing(p.x,p.y, R*1.25, "#7ad7ff", 0.5, 4); }
    if(hasPair("area","ember")) G.grounds.push({x:p.x,y:p.y,r:R*0.8,t:0,life:2.2,dmg:12,k:0});
    for(let i=0;i<14+Math.floor(st.area*8);i++){
      const aa=i/(14+st.area*8)*Math.PI*2, rgb=hexRgb(st.cols[i%st.cols.length]);
      G.particles.push({x:p.x,y:p.y,vx:Math.cos(aa)*240*st.area,vy:Math.sin(aa)*240*st.area,r:5+st.size*2,life:0.4,t:0,cr:rgb[0],cg:rgb[1],cb:rgb[2],glow:true});
    }
    beep(220,0.18,"sine",0.05,90);
  } else if(id==="cleave"){
    const reach=78*st.area;
    for(let i=0;i<G.enemies.length;i++){
      const e=G.enemies[i]; if(e.dead) continue;
      if(dist(p,e)>reach+e.r) continue;
      const da=Math.abs(Math.atan2(e.y-p.y,e.x-p.x)-a);
      if(Math.min(da, Math.PI*2-da)<1.15) hitEnemy(e, base, {melee:true,phys:true,fire:p.mods.ignite||p.mods.addFire>0});
    }
    st.cols.forEach(function(c,i){ addArc(p.x,p.y,a+i*0.08, reach, c, 0.26); });
    burst(p.x+Math.cos(a)*40, p.y+Math.sin(a)*40, st.cols[0], 10+st.proj*2, 140, 4);
    noiseHit(0.04,0.06);
  } else if(id==="whirl"){
    p.whirl=1.6; beep(140,0.2,"sawtooth",0.04,80); addRing(p.x,p.y,80*st.area,st.cols[0],0.3,4);
  } else if(id==="blink" || id==="leap" || id==="roll"){
    const distDash = id==="roll"?170:210;
    const mx = stick.x || Math.cos(a), my = stick.y || Math.sin(a);
    const l=vlen(mx,my), dx=mx/l, dy=my/l;
    p.invuln = id==="roll"?0.35:0.22;
    for(let i=1;i<=8;i++){
      p.x+=dx*distDash/8; p.y+=dy*distDash/8; separateWall(p);
      if((p.mods.groundFire || id==="blink") && i%2===0) G.grounds.push({x:p.x,y:p.y,r:28*st.area,t:0,life:1.6,dmg:12,k:0});
    }
    if(id==="leap" || id==="blink") radiusDamage(p.x,p.y,80*st.area, base, id==="blink"?{fire:true}:{phys:true,melee:true});
    st.cols.forEach(function(c){ addRing(p.x,p.y,70*st.area,c,0.3,3); burst(p.x,p.y,c,12,180,5); });
  } else if(id==="rain"){
    const tx=tgt?tgt.x:p.x+Math.cos(a)*220, ty=tgt?tgt.y:p.y+Math.sin(a)*220;
    const extra=4+st.proj*2;
    for(let i=0;i<extra;i++){
      (function(ox,oy,delay,col){
        later(function(){
          if(G.paused||p.dead) return;
          radiusDamage(tx+ox, ty+oy, 42*st.area, base, {phys:true, light:true, proj:true, fire:p.mods.addFire>0});
          sparkLine(tx+ox, ty+oy-90, tx+ox, ty+oy, col);
          addRing(tx+ox, ty+oy, 36*st.area, col, 0.25, 2);
        }, delay);
      })(rand(-80,80)*st.area, rand(-80,80)*st.area, i*60, st.cols[i%st.cols.length]);
    }
  }

function moveAxis(){
  let x=stick.x, y=stick.y;
  if(keys["w"]||keys["arrowup"]) y-=1;
  if(keys["s"]||keys["arrowdown"]) y+=1;
  if(keys["a"]||keys["arrowleft"]) x-=1;
  if(keys["d"]||keys["arrowright"]) x+=1;
  const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; }
  return {x:x,y:y};
}
function enterPortal(){
  if(!G.portal) return;
  G.portal=null; G.moveTarget=null; $("portalBtn").style.display="none";
  if(G.room>=3) onWin(); else startDraft();
}
function updatePlayer(dt){
  const p=G.player; if(p.dead) return;
  const mv=moveAxis();
  const sp=p.speed*p.mods.move*(p.whirl>0?0.72:1);
  p.x+=mv.x*sp*dt; p.y+=mv.y*sp*dt;
  p.x=clamp(p.x,50,G.roomW-50); p.y=clamp(p.y,50,G.roomH-50);
  separateWall(p);
  p.moving=!!(mv.x||mv.y||G.moveTarget); if(mv.x||mv.y) p.facing=Math.atan2(mv.y,mv.x);
  p.atkCd=Math.max(0,p.atkCd-dt); p.invuln=Math.max(0,p.invuln-dt);
  p.hitT=Math.max(0,p.hitT-dt); p.whirl=Math.max(0,p.whirl-dt); p.flask=Math.max(0,p.flask-dt);
  if(p.flasking>0){ p.flasking-=dt; p.hp=Math.min(p.maxhp, p.hp+p.maxhp*0.28*dt/2.0); }
  p.mp=Math.min(p.maxmp, p.mp+11*dt);
  p.esDelay=Math.max(0,p.esDelay-dt);
  if(p.esDelay<=0) p.es=Math.min(p.maxes, p.es+p.maxes*0.14*dt);
  for(let i=0;i<3;i++) p.cds[i]=Math.max(0,p.cds[i]-dt);
  const tgt=nearestEnemy(p,420);
  if(tgt && p.atkCd<=0 && p.whirl<=0){
    const id=p.skills[0];
    if(isBasic(id) && dist(p,tgt)<(id==="cleave"?90:420)) castSlot(0);
  }
  if(p.whirl>0){
    p.whirlTick-=dt;
    if(p.whirlTick<=0){ p.whirlTick=0.12; radiusDamage(p.x,p.y,72*p.mods.area, skillBase("whirl"), {melee:true,phys:true}); }
  }
  if(p.hero.trait==="rage" && p.trait>0) p.trait=Math.max(0,p.trait-8*dt);
  if(G.portal && dist(p,G.portal)<52) enterPortal();
  if(G.moveTarget){
    const dx=G.moveTarget.x-p.x, dy=G.moveTarget.y-p.y, l=Math.hypot(dx,dy);
    if(l<16) G.moveTarget=null;
    else if(!(mv.x||mv.y)){ p.x+=dx/l*sp*dt; p.y+=dy/l*sp*dt; p.facing=Math.atan2(dy,dx); }
  }
  p.animT += dt * (p.moving?11:2.2);
  p.attackT = Math.max(0, p.attackT-dt);
}
function updatePet(dt){
  const pet=G.pet, p=G.player;

  const k=1-Math.pow(0.001,dt);

function updateEnemies(dt){
  const p=G.player;
  G.spawnT-=dt;
  while(G.spawnQueue.length && G.spawnT<=0){ spawnAround(G.spawnQueue.shift()); G.spawnT = G.room===3?0.22:0.07; }
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i]; if(e.dead) continue;
    e.t+=dt; e.hit=Math.max(0,e.hit-dt); e.chill=Math.max(0,e.chill-dt); e.mark=Math.max(0,e.mark-dt);
    if(e.burn>0){
      e.burn-=dt; e.bt-=dt;
      if(e.bt<=0){ e.bt=0.4; e.hp-=6+G.room*2; addFloat(e.x,e.y-10,"灼烧","#ff8a3a"); if(e.hp<=0){ e.dead=true; onKill(e); continue; } }
    }
    const slow=e.chill>0?0.72:1;
    e.atk=Math.max(0,e.atk-dt);
    if(e.telegraph){
      e.telegraph.t-=dt;
      if(e.telegraph.t<=0){
        const tg=e.telegraph; e.telegraph=null;
        if(tg.kind==="slam"){ radiusDamageEnemy(tg.x,tg.y,tg.r, e.dmg*2.3); G.shake=14; }
      } else continue;
    }
    if(e.type==="boss") updateBoss(e,dt,slow);
    else {
      const d=dist(e,p);
      const desired=e.kind==="ranged"?280:0;
      let a=ang(e,p);
      if(e.kind==="ranged" && d<desired-20) a+=Math.PI;
      if(e.kind==="ranged" && Math.abs(d-desired)<40) a+=Math.PI/2*Math.sin(e.t*2);
      if(e.kind!=="ranged" && d<140) a += (e.x>p.x?0.9:-0.9);
      e.facing=a;
      e.x+=Math.cos(a)*e.speed*slow*dt;
      e.y+=Math.sin(a)*e.speed*slow*dt;
      separateWall(e);
      if(e.kind==="ranged" && e.atk<=0 && d<520){
        e.atk=1.05; const sp=400; const sa=ang(e,p);
        G.bullets.push({x:e.x,y:e.y,vx:Math.cos(sa)*sp,vy:Math.sin(sa)*sp,r:7,dmg:e.dmg,life:1.8,pierce:0,chain:0,hit:new Set(),color:"#b48cff",from:"enemy",opt:{}});
      }
      if(e.kind!=="ranged" && d<e.r+p.r+8 && e.atk<=0){
        e.atk=e.elite?0.7:0.48; dealPlayerHit(e,e.dmg); burst(p.x,p.y,"#c4453c",6,80,3);
      }
      if(e.elite && e.atk<=0 && d<260 && Math.random()<0.55){
        e.telegraph={kind:"slam",x:p.x,y:p.y,r:86,t:0.55,max:0.55}; e.atk=1.6;
      }
    }
  }
  G.enemies=G.enemies.filter(function(e){ return !e.dead; });
  if(!G.spawnQueue.length && G.enemies.length===0 && !G.cleared && G.state==="play"){
    G.wave++;
    if(G.wave>=ROOMS[G.room].waves.length) openPortal(); else queueWave();
  }
}
function radiusDamageEnemy(x,y,r,dmg){
  const p=G.player;

  burst(x,y,"#ff6a4a",20,200,6);

function updateBoss(e, dt, slow){
  const p=G.player;
  if(e.hp<e.maxhp*0.5) e.phase=2;
  if(e.hp<e.maxhp*0.22) e.phase=3;
  const d=dist(e,p), a=ang(e,p); e.facing=a;
  if(d>90){ e.x+=Math.cos(a)*e.speed*slow*1.15*dt; e.y+=Math.sin(a)*e.speed*slow*1.15*dt; }
  separateWall(e);
  e.pat-=dt;
  if(e.pat<=0){
    const roll=Math.random();
    if(roll<0.38){ e.telegraph={kind:"slam",x:p.x,y:p.y,r:115,t:0.62,max:0.62}; e.pat=1.45; }
    else if(roll<0.7){
      const ba=a; e.telegraph={kind:"beam",t:0.42,max:0.42,a:ba}; e.pat=1.7;
      later(function(){ if(!e.dead && !G.paused) fireBossBeam(e, ba); }, 420);
    } else {
      for(let i=0;i<4;i++) spawnAround(pick(["mage","skel","bat","brute"]));
      e.pat=2.4; hint("监视者召唤增援", 1.2);
    }
  }
  if(d<e.r+p.r+8 && e.atk<=0){ e.atk=1.0; dealPlayerHit(e, e.dmg); }
  if(e.phase===3 && Math.random()<0.03) radiusDamageEnemy(e.x,e.y,180,22);
}
function fireBossBeam(e, a){
  const L=700;
  for(let i=0;i<18;i++) burst(e.x+Math.cos(a)*i*40, e.y+Math.sin(a)*i*40, "#ff6a4a", 4, 40, 3);
  const p=G.player, px=p.x-e.x, py=p.y-e.y;
  const proj=px*Math.cos(a)+py*Math.sin(a);
  const cross=Math.abs(px*Math.sin(a)-py*Math.cos(a));
  if(proj>0 && proj<L && cross<28) dealPlayerHit(e, e.dmg*1.85);
  G.shake=10;
}
function updateBullets(dt){
  for(let i=0;i<G.bullets.length;i++){
    const b=G.bullets[i];
    b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.from==="player"){ b.trail=(b.trail||0)+dt; if(b.trail>0.025){ b.trail=0; const rgb=hexRgb(b.color||"#fff"); G.particles.push({x:b.x,y:b.y,vx:0,vy:0,r:(b.r||6)*0.65,life:0.16,t:0,cr:rgb[0],cg:rgb[1],cb:rgb[2],glow:true}); } }
    if(wallAt(b.x,b.y,b.r) && b.from==="player"){ b.life=0; burst(b.x,b.y,b.color,4,60,2); }
    if(b.from==="player"){
      for(let j=0;j<G.enemies.length;j++){
        const e=G.enemies[j]; if(e.dead || b.hit.has(e)) continue;
        if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
          b.hit.add(e);
          const hopt=Object.assign({}, b.opt, {chainJump:!!b.chained});
          hitEnemy(e,b.dmg,hopt); burst(b.x,b.y,b.color,6,90,3);
          if(hasPair("pierce","extra") && b.pierce>0 && synReady("split"+e.x.toFixed(0),0.08)){
            const n2=nearestEnemy(e,220);
            if(n2 && n2!==e){
              const aa=ang(e,n2), sp=280;
              spawnProj({x:e.x,y:e.y,vx:Math.cos(aa)*sp,vy:Math.sin(aa)*sp,r:5,dmg:b.dmg*0.45,pierce:1,chain:0,color:b.color,opt:Object.assign({},b.opt,{syn:true}),life:0.7});
            }
          }
          if(b.pierce>0) b.pierce--;
          else if(b.chain>0){
            const keep=e.lastCrit && hasPair("crit","chain") && !b.critKept;
            if(keep) b.critKept=true;
            else b.chain--;
            const rng=hasPair("spark","chain")?320:240;
            const n=nearestEnemy(e,rng);
            if(n && !b.hit.has(n)){ const na=ang(b,n), sp=vlen(b.vx,b.vy); b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp; b.x=e.x; b.y=e.y; b.chained=true; }
            else b.life=0;
          } else b.life=0;
        }
      }
    } else {
      const p=G.player;
      if(!p.dead && Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){ dealPlayerHit({type:"mage",dmg:b.dmg}, b.dmg); b.life=0; }
    }
  }
  G.bullets=G.bullets.filter(function(b){ return b.life>0; });
}

function wx(x){ return x - G.cam.x + (G.sx||0); }
function wy(y){ return y - G.cam.y + (G.sy||0); }
function inView(x,y,p){ p=p||80; return x>G.cam.x-p && x<G.cam.x+W+p && y>G.cam.y-p && y<G.cam.y+H+p; }

function drawFloor(){
  const s=72;
  const x0=Math.floor(G.cam.x/s)-1, y0=Math.floor(G.cam.y/s)-1;
  const x1=Math.floor((G.cam.x+W)/s)+1, y1=Math.floor((G.cam.y+H)/s)+1;
  for(let gy=y0; gy<=y1; gy++){
    for(let gx=x0; gx<=x1; gx++){
      const n=((gx*734287 + gy*912991)>>>0)%7;
      const shade = 18 + n*3;
      ctx.fillStyle = "rgb(" + (shade+6) + "," + (shade) + "," + (shade+10) + ")";
      ctx.fillRect(wx(gx*s), wy(gy*s), s+1, s+1);
      ctx.strokeStyle = "rgba(40,32,50,0.35)";
      ctx.strokeRect(wx(gx*s)+0.5, wy(gy*s)+0.5, s, s);
      if(n===0){
        ctx.fillStyle="rgba(90,50,30,0.18)";
        ctx.beginPath(); ctx.arc(wx(gx*s+36), wy(gy*s+40), 10, 0, 6.28); ctx.fill();
      }
    }
  }
}
function drawWalls(){
  G.walls.forEach(function(w){
    ctx.fillStyle = w.pillar ? "#2a2230" : "#161018";
    ctx.fillRect(wx(w.x), wy(w.y), w.w, w.h);
    ctx.strokeStyle = "#4a3a28";
    ctx.strokeRect(wx(w.x)+0.5, wy(w.y)+0.5, w.w, w.h);
    if(w.pillar){
      ctx.fillStyle="#3a2a22";
      ctx.fillRect(wx(w.x)+8, wy(w.y)+8, w.w-16, w.h-16);
      ctx.strokeStyle="#e2b85b44";
      ctx.strokeRect(wx(w.x)+8, wy(w.y)+8, w.w-16, w.h-16);
    }
  });
}
function drawTorches(t){
  G.torches.forEach(function(tr){
    const flick = 0.75 + Math.sin(t*8+tr.t)*0.15 + Math.random()*0.05;
    const x=wx(tr.x), y=wy(tr.y);
    ctx.fillStyle="#3a2a20"; ctx.fillRect(x-3,y-8,6,16);
    const g=ctx.createRadialGradient(x,y-14,2,x,y-14,38*flick);
    g.addColorStop(0,"rgba(255,200,90," + (0.85*flick) + ")");
    g.addColorStop(0.4,"rgba(255,120,40,0.25)");
    g.addColorStop(1,"rgba(255,80,0,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y-14,38*flick,0,6.28); ctx.fill();
  });
}
function drawShadow(x,y,r){
  ctx.fillStyle="rgba(0,0,0,0.45)";

function drawHumanoid(ent, pal, weapon, isPlayer){
  const x=wx(ent.x), y=wy(ent.y);
  const a=ent.facing||0;
  const bob=Math.sin((G.time||0)*8 + ent.x)* (isPlayer?2.2:1.4);

  if(ent.invuln>0 && ((G.time*20)|0)%2===0) ctx.globalAlpha=0.45;

  ctx.rotate(a*0.15);
  ctx.fillStyle=pal.body;

  ctx.stroke();
  if(weapon==="staff"){
    ctx.strokeStyle=pal.color2;

    ctx.fillStyle=pal.color2; ctx.beginPath(); ctx.arc(16,-30,5,0,6.28); ctx.fill();
  } else if(weapon==="axe"){
    ctx.strokeStyle="#d8d0c0"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(-16,6); ctx.lineTo(-26,-18); ctx.moveTo(16,6); ctx.lineTo(26,-18); ctx.stroke();
    ctx.fillStyle=pal.glow; ctx.beginPath(); ctx.arc(-26,-20,6,0,6.28); ctx.arc(26,-20,6,0,6.28); ctx.fill();
  } else if(weapon==="bow"){
    ctx.strokeStyle=pal.glow; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(18,-8,14,-1.2,1.2); ctx.stroke();
  }

}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function heroPal(hero){
  return { body:"#2a2430", accent:hero.color, head:"#e6d2b8", hood:"#1a1420", glow:hero.color, color2:hero.color2 };
}
function drawEnemy(e){
  if(!inView(e.x,e.y,60)) return;
  const x=wx(e.x), y=wy(e.y);
  drawShadow(e.x,e.y,e.r);
  if(e.telegraph){
    const k=1-e.telegraph.t/e.telegraph.max;
    ctx.strokeStyle="rgba(255,70,50," + (0.4+k*0.5) + ")";
    ctx.lineWidth=2;
    if(e.telegraph.kind==="slam"){
      ctx.beginPath(); ctx.arc(wx(e.telegraph.x), wy(e.telegraph.y), e.telegraph.r*k, 0,6.28); ctx.stroke();
      ctx.fillStyle="rgba(255,50,40,0.12)"; ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(e.telegraph.a)*700, y+Math.sin(e.telegraph.a)*700);
      ctx.stroke();
    }
  }
  ctx.save();
  ctx.translate(x,y);
  if(e.hit>0) ctx.filter="brightness(2)";
  const col=e.color;
  if(e.type==="boss"){
    ctx.fillStyle="#1a0c12";
    ctx.beginPath(); ctx.ellipse(0,0,e.r*1.1,e.r*0.9,0,0,6.28); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(-12,-8,6,0,6.28); ctx.arc(12,-8,6,0,6.28); ctx.fill();
    ctx.fillStyle="#ffeeaa"; ctx.beginPath(); ctx.arc(0,-18,8,0,6.28); ctx.fill();
    const g=ctx.createRadialGradient(0,0,10,0,0,e.r*1.8);
    g.addColorStop(0,"rgba(255,80,40,0.25)"); g.addColorStop(1,"rgba(255,40,0,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,e.r*1.8,0,6.28); ctx.fill();
  } else if(e.type==="bat"){
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(0,0,e.r,e.r*0.6,0,0,6.28); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-e.r,0); ctx.quadraticCurveTo(-e.r*1.6,-e.r*1.4+Math.sin(e.t*16)*6,-e.r*0.2,-2);
    ctx.moveTo(e.r,0); ctx.quadraticCurveTo(e.r*1.6,-e.r*1.4+Math.sin(e.t*16)*6,e.r*0.2,-2);
    ctx.strokeStyle=col; ctx.lineWidth=3; ctx.stroke();
  } else {
    ctx.fillStyle="#1c161c";
    roundRect(-e.r*0.7,-e.r*1.1,e.r*1.4,e.r*1.8,5); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=e.elite?3:1.5; ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,-e.r*1.35,e.r*0.55,0,6.28); ctx.fill();
    if(e.kind==="ranged"){ ctx.fillStyle="#c9b6ff"; ctx.beginPath(); ctx.arc(e.r*0.7,-e.r*0.2,4,0,6.28); ctx.fill(); }
  }
  ctx.restore();
  if(e.chill>0){ ctx.strokeStyle="rgba(140,220,255,0.6)"; ctx.beginPath(); ctx.arc(x,y,e.r+6,0,6.28); ctx.stroke(); }
  if(e.mark>0){ ctx.strokeStyle="#f3d37a"; ctx.beginPath(); ctx.arc(x,y-e.r-10,4,0,6.28); ctx.stroke(); }
  if(e.hp<e.maxhp){
    ctx.fillStyle="#0008"; ctx.fillRect(x-18, y-e.r-16, 36, 4);
    ctx.fillStyle=e.elite?"#ff8a3a":"#c4453c";
    ctx.fillRect(x-18, y-e.r-16, 36*(e.hp/e.maxhp), 4);
  }
}
function heroView(facing){
  const ax=Math.cos(facing), ay=Math.sin(facing);
  if(ay>0.40) return {img:SPR.front, flip:false};
  if(ay<-0.40) return {img:SPR.back, flip:ax>0};
  return {img:SPR.side, flip:ax>0};
}
function drawPlayer(){
  const p=G.player; if(!p) return;
  const st=vfx();
  if(p.whirl>0){
    ctx.save(); ctx.translate(wx(p.x), wy(p.y));
    ctx.strokeStyle=st.cols[0]; ctx.globalAlpha=0.45; ctx.lineWidth=6+4*st.area;
    ctx.beginPath(); ctx.arc(0,0,62*st.area, G.time*16, G.time*16+2.4); ctx.stroke();
    ctx.strokeStyle=st.cols[st.cols.length>1?1:0]; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,48*st.area, -G.time*12, -G.time*12+1.6); ctx.stroke();
    ctx.restore();
  }
  drawShadow(p.x, p.y, 22);
  const x=wx(p.x), y=wy(p.y);
  const moving=!!p.moving && p.attackT<=0;
  const atk=p.attackT>0;
  let squash=1, shear=0, rot=0, dx=0, hop=0;
  if(atk){
    const u=1-p.attackT/p.attackMax;
    if(u<0.28){ const k=u/0.28; rot=-0.32*k; dx=-12*k; squash=1-0.07*k; }
    else if(u<0.52){ const k=(u-0.28)/0.24; rot=-0.32+0.62*k; dx=-12+32*k; squash=0.93+0.18*k; hop=-6*k; }
    else { const k=(u-0.52)/0.48; rot=0.30*(1-k); dx=20*(1-k); squash=1.11-0.11*k; hop=-6*(1-k); }
    if(!p.didSlash && u>=0.28 && u<0.55){
      p.didSlash=true;
      const a=p.facing;
      st.cols.forEach(function(c,i){ addArc(p.x, p.y, a+(i-1)*0.12, 78*st.area, c, 0.28); });
      muzzle(p.x+Math.cos(a)*28, p.y+Math.sin(a)*28, a, st.cols[0]);
    }
  } else if(moving){
    const c=p.animT, s=Math.sin(c), co=Math.cos(c);
    hop=Math.abs(s)*8; squash=1-Math.abs(co)*0.10; shear=s*0.16; rot=s*0.11;
    if(Math.abs(co)>0.92 && Math.random()<0.6) addDust(p.x-Math.cos(p.facing)*8, p.y+10);
  } else hop=Math.sin(G.time*2.3)*2.2;
  const v=(sprReady>=1)?heroView(p.facing):null;
  function stamp(alpha, ox, oy, extraRot){
    if(!(v && v.img && v.img.naturalWidth)) return;
    ctx.save();
    ctx.translate(x+ox, y+4+oy);
    ctx.globalAlpha=alpha;
    if(p.hitT>0) ctx.globalAlpha*=0.72;
    if(p.invuln>0 && ((G.time*20)|0)%2===0) ctx.globalAlpha*=0.5;
    ctx.transform(1, 0, shear, squash, 0, 0);
    ctx.rotate(rot+(extraRot||0)+(p.whirl>0?G.time*14:0));
    if(v.flip) ctx.scale(-1,1);
    const h=108, w=h*v.img.width/v.img.height;
    ctx.drawImage(v.img, -w/2+dx, -h+12-hop, w, h);
    ctx.restore();
  }
  if(moving || atk){
    const bx=-Math.cos(p.facing), by=-Math.sin(p.facing);
    stamp(0.18, bx*16, by*16, -0.08);
    stamp(0.10, bx*28, by*28, -0.12);
  }
  ctx.save(); ctx.translate(x,y+4);
  ctx.fillStyle=p.hero.color; ctx.globalAlpha=0.28;
  ctx.beginPath(); ctx.ellipse(0,-8,28,16,0,0,6.28); ctx.fill(); ctx.restore();
  if(v && v.img && v.img.naturalWidth) stamp(1,0,0,0);
  else {
    const weapon = p.hero.id==="gemma"?"staff": p.hero.id==="rehan"?"axe":"bow";
    drawHumanoid(p, heroPal(p.hero), weapon, true);
  }
  if(p.es>0){
    ctx.strokeStyle="rgba(110,224,239," + (0.25+0.25*p.es/p.maxes) + ")";
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(wx(p.x), wy(p.y)-10, 30, 0, 6.28); ctx.stroke();
  }
}

function drawGrounds(){
  G.grounds.forEach(function(g){

    ctx.beginPath(); ctx.arc(wx(g.x), wy(g.y), g.r, 0,6.28); ctx.fill();
    ctx.strokeStyle="rgba(255,180,60," + (0.35*a) + ")";

  });
}
function drawBullets(){
  const st=G.player?vfx():{cols:["#fff"],size:1,chain:0,pierce:0};
  G.bullets.forEach(function(b){
    const x=wx(b.x), y=wy(b.y);
    const ang=Math.atan2(b.vy,b.vx);
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    const r=(b.r||7)* (b.from==="player"?st.size:1);
    ctx.shadowColor=b.color; ctx.shadowBlur=14+ (b.from==="player"?st.size*8:0);
    if(b.from==="player" && st.pierce){
      ctx.fillStyle=b.color; ctx.globalAlpha=0.35;
      ctx.fillRect(-r*6, -r*0.5, r*6, r);
    }
    ctx.globalAlpha=1;
    const grd=ctx.createRadialGradient(0,0,1,0,0,r*1.8);
    grd.addColorStop(0,"#fff"); grd.addColorStop(0.35,b.color); grd.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(0,0, r*1.8, r*0.9, 0,0,6.28); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(r*0.2,0, r*0.35,0,6.28); ctx.fill();
    if(b.from==="player" && st.chain){
      ctx.strokeStyle="#9ad0ff"; ctx.globalAlpha=0.8; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-r, -r); ctx.lineTo(r, r*0.2); ctx.moveTo(-r*0.2,r); ctx.lineTo(r*0.6,-r); ctx.stroke();
    }
    ctx.restore(); ctx.shadowBlur=0;
  });
}

function drawParticles(){
  G.particles.forEach(function(pt){
    const a=1-pt.t/pt.life;
    if(pt.kind==="ring"){
      const rr=pt.r0+(pt.r1-pt.r0)*(pt.t/pt.life);
      ctx.strokeStyle=pt.color; ctx.globalAlpha=a*0.85; ctx.lineWidth=pt.width||3;
      ctx.beginPath(); ctx.arc(wx(pt.x), wy(pt.y), rr, 0,6.28); ctx.stroke(); ctx.globalAlpha=1; return;
    }
    if(pt.kind==="arc"){
      ctx.strokeStyle=pt.color; ctx.globalAlpha=a; ctx.lineWidth=4+6*a;
      ctx.beginPath();
      const reach=pt.reach*(0.6+0.4*(1-a));
      ctx.arc(wx(pt.x), wy(pt.y), reach, pt.a-0.9, pt.a+0.9);
      ctx.stroke(); ctx.globalAlpha=1; return;
    }
    if(pt.line){
      ctx.strokeStyle=pt.color; ctx.globalAlpha=a; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(wx(pt.x),wy(pt.y)); ctx.lineTo(wx(pt.x2),wy(pt.y2)); ctx.stroke();
      ctx.globalAlpha=1; return;
    }
    ctx.fillStyle="rgba(" + (pt.cr||255) + "," + (pt.cg||200) + "," + (pt.cb||80) + "," + a + ")";
    ctx.beginPath(); ctx.arc(wx(pt.x), wy(pt.y), (pt.r||3)*a, 0,6.28); ctx.fill();
  });
}

function drawFloats(){
  G.floats.forEach(function(f){

  });

function drawLighting(){

function render(){
  G.sx=(Math.random()*2-1)*G.shake;
  G.sy=(Math.random()*2-1)*G.shake;
  ctx.clearRect(0,0,W,H);
  if(!G.player || G.state==="title" || G.state==="hero"){
    drawTitleBg();
    return;
  }
  ctx.save();
  drawFloor();
  drawGrounds();
  drawWalls();
  drawTorches(G.time);
  drawLoot();
  drawPortal();
  const ents=[];
  G.enemies.forEach(function(e){ ents.push({y:e.y, draw:function(){ drawEnemy(e); }}); });
  ents.push({y:G.pet.y, draw:drawPet});
  ents.push({y:G.player.y, draw:drawPlayer});
  ents.sort(function(a,b){ return a.y-b.y; });
  ents.forEach(function(e){ e.draw(); });
  drawBullets();
  drawParticles();
  drawLighting();
  drawFloats();
  if(G.combo>4){
    ctx.fillStyle="#f6e2a4"; ctx.font="bold 22px PingFang SC,sans-serif"; ctx.textAlign="center";
    ctx.fillText("连斩 " + G.combo, W/2, 150);
  }
  ctx.restore();
}

function drawHeroThumb(cx,h){

  const img=SPR.front;
  if(img && img.naturalWidth){
    const hgt=112, w=hgt*img.width/img.height;
    cx.drawImage(img, (80-w)/2, 8, w, hgt);
  }
  cx.strokeStyle=h.color; cx.globalAlpha=0.5; cx.strokeRect(0.5,0.5,79,119); cx.globalAlpha=1;
}

function startRun(){
  const hero=HEROES.find(function(h){ return h.id===G.heroId; }) || HEROES[0];
  G.player=makePlayer(hero); G.pet=makePet(G.player);
  (function(){ const w=makeGear("weapon","white",0); G.player.gear.weapon=w; gearApply(w,1); refreshEq(); })();
  G.room=0; G.kills=0; G.gold=0; G.time=0; G.dmgDone=0; G.maxCombo=0; G.combo=0; G.chosen=[];
  G.state="play"; G.paused=false; show(null);
  buildRoom(); refreshHud();
  hint("点击左上角装备可强化或洗练", 3);
}
function ampPreviewClass(id){
  const map={extra:"pv-extra",chain:"pv-chain",pierce:"pv-pierce",area:"pv-area",crit:"pv-crit",speed:"pv-speed",echo:"pv-echo",added:"pv-fire",novaKill:"pv-kill",esOnHit:"pv-es",ms:"pv-ms",leech:"pv-fire",chill:"pv-cold",ignite:"pv-fire",magnet:"pv-ms",cdr:"pv-speed",ember:"pv-legend",time:"pv-echo",fortress:"pv-es",overkill:"pv-crit",spark:"pv-chain"};
  return map[id]||"pv-legend";
}
function ampStatLine(c,p){
  const sk=SKILLS[p.skills[0]].name, m=p.mods;
  if(c.id==="extra") return sk+" 投射物 "+m.proj+" → "+(m.proj+2);
  if(c.id==="chain") return sk+" 连锁 "+m.chain+" → "+(m.chain+3);
  if(c.id==="pierce") return sk+" 穿透 "+m.pierce+" → "+(m.pierce+4);
  if(c.id==="area") return sk+" 范围 ×"+m.area.toFixed(1)+" → ×"+(m.area+0.4).toFixed(1);
  if(c.id==="crit") return "暴击率 "+Math.round(m.crit*100)+"% → "+Math.round((m.crit+0.18)*100)+"%";
  if(c.id==="speed") return "攻速 ×"+m.atkSpd.toFixed(2)+" → ×"+(m.atkSpd+0.28).toFixed(2);
  if(c.id==="echo") return sk+" 40% 几率再释放一次";
  if(c.id==="added") return sk+" 附加冰火电伤害";
  if(c.id==="novaKill") return "击杀时触发火焰新星";
  if(c.id==="esOnHit") return "击中回复能量护盾 +4";
  if(c.id==="ms") return "移动速度 +18%";
  if(c.id==="leech") return "伤害偷取生命 4%";
  if(c.id==="chill") return sk+" 附带冰缓，冰伤 +20%";
  if(c.id==="ignite") return sk+" 附带点燃，火伤 +20%";
  if(c.id==="cdr") return "技能冷却 -22%";
  if(c.id==="ember") return sk+" 留下燃烧地面";
  if(c.id==="time") return sk+" 0.35 秒后残响再放";
  if(c.id==="fortress") return "生命与护盾 +35%";
  if(c.id==="overkill") return "残血处决伤害 +80%";
  if(c.id==="spark") return "暴击时连锁闪电";
  return c.text;
}
function refreshAmpHud(){
  const box=$("ampDock"); if(!box || !G.player) return;
  if(!G.chosen.length || G.state!=="play"){ box.style.display="none"; box.innerHTML=""; }
  else {
    box.style.display="flex";
    const sk=SKILLS[G.player.skills[0]].name;
    box.innerHTML='<span class="amp-sk">'+sk+' · 增幅 '+G.chosen.length+'</span>'+G.chosen.map(function(c){ return '<span class="chip">'+c.name+'</span>'; }).join("")+activeSynergies().map(function(s){ return '<span class="chip syn">'+s.name+'</span>'; }).join("");
  }
  const gems=document.querySelector("#btnS0 .gems");
  if(gems){
    let html="";
    for(let i=0;i<4;i++) html+='<i class="'+(i<G.chosen.length?"on":"")+'"></i>';
    gems.innerHTML=html;
  }
  const n=$("ampN");
  if(n){ if(G.chosen.length){ n.textContent=String(G.chosen.length); n.classList.add("show"); } else n.classList.remove("show"); }
}
function startDraft(){
  G.paused=true; G.state="draft"; show("ovDraft");
  const pool = G.room===0 ? DRAFTS.blessing : G.room===1 ? DRAFTS.support : DRAFTS.legend;
  const taken=G.chosen.map(function(x){ return x.id; });
  const avail=pool.filter(function(c){ return taken.indexOf(c.id)<0; });
  const cards=[]; const copy=avail.slice();
  while(cards.length<3 && copy.length){ cards.push(copy.splice(irand(0,copy.length-1),1)[0]); }
  const sk=SKILLS[G.player.skills[0]];
  $("draftKicker").textContent="SKILL AMPLIFY";
  $("draftTitle").textContent="选择技能增幅";
  $("draftSub").textContent="强化 "+sk.name+" · 增幅会立刻改变技能表现";
  const box=$("draftCards"); box.innerHTML="";
  cards.forEach(function(c){
    const el=document.createElement("div"); el.className="card";
    const pv=ampPreviewClass(c.id);
    el.innerHTML='<div class="preview"><div class="pv '+pv+'"><i></i><i></i><i></i></div></div>'+
      '<div class="tag">技能增幅 · '+c.tag+'</div><b>'+c.name+'</b>'+
      '<div class="stat">'+ampStatLine(c,G.player)+'</div>'+
      '<p>'+c.text+'</p>'+(function(){ var ss=synergiesIfPick(c); return ss.length?'<div class="syn">联动 · '+ss.map(function(s){return s.name+'：'+s.text;}).join('<br/>')+'</div>':''; })();
    el.onclick=function(){ pickDraft(c); };
    box.appendChild(el);
  });
}
function pickDraft(c){
  const sk=SKILLS[G.player.skills[0]];
  const line=ampStatLine(c,G.player);
  const news=synergiesIfPick(c);
  c.apply(G.player); G.chosen.push(c); applySynergyBonuses();
  $("ampIcon").textContent=sk.icon;
  $("ampTitle").textContent=news.length?("联动 · "+news[0].name):(sk.name+" 已增幅");
  $("ampDesc").innerHTML="<b style='color:var(--gold2)'>"+c.name+"</b><br/>"+line+(news.length?("<br/><span style='color:#7ad7ff'>"+news.map(function(s){return s.name+"："+s.text;}).join("<br/>")+"</span>"):"");
  $("ampNow").innerHTML="当前链接<br/>"+G.chosen.map(function(x){ return x.name; }).join("  ·  ");
  show("ovAmp");
  refreshAmpHud();
  refreshEq();
  setTimeout(function(){
    G.room++; G.state="play"; G.paused=false; show(null); buildRoom(); refreshAmpHud();
  refreshEq();
    hint(news.length?(news[0].name+" 已激活"):(sk.name+" · "+c.name), 1.8);
  }, 1600);
}

function onDeath(){
  G.paused=true; G.state="result";
  $("resKicker").textContent="YOU DIED";
  $("resTitle").textContent="你倒下了";
  $("resSub").textContent="异界收回了这具躯体。调整走位，或换一位英雄再试。";
  fillResult(); show("ovResult");
}
function onWin(){
  G.paused=true; G.state="result";
  $("resKicker").textContent="NETHERREALM CLEARED";
  $("resTitle").textContent="异界已净化";
  $("resSub").textContent="监视者坠落。这只是刻度 I 的入口。";
  fillResult(); show("ovResult");
}
function fillResult(){
  $("resStats").innerHTML =
    "<div>英雄 <i>" + G.player.hero.name + "</i></div>" +
    "<div>用时 <i>" + Math.floor(G.time/60) + ":" + String(Math.floor(G.time%60)).padStart(2,"0") + "</i></div>" +
    "<div>击杀 <i>" + G.kills + "</i></div>" +
    "<div>金币 <i>" + G.gold + "</i></div>" +
    "<div>伤害 <i>" + Math.round(G.dmgDone) + "</i></div>" +
    "<div>最高连斩 <i>" + G.maxCombo + "</i></div>" +
    "<div style='grid-column:1/-1'>构筑 <i>" + (G.chosen.map(function(c){return c.name;}).join(" / ") || "无") + "</i></div>" +
    "<div style='grid-column:1/-1'>装备 <i>" + SLOTS.map(function(s){ const it=G.player.gear[s]; return SLOT_CN[s]+(it?(": "+it.name):": —"); }).join(" / ") + "</i></div>";
}

let dpr=1;
function resize(){
  const frame=document.getElementById("frame");
  const r=frame.getBoundingClientRect();
  dpr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=Math.floor(r.width*dpr);
  canvas.height=Math.floor(r.height*dpr);
  const sx=r.width/W, sy=r.height/H;
  canvas._sx=sx; canvas._sy=sy;
  ctx.setTransform(dpr*sx,0,0,dpr*sy,0,0);
  dpr = dpr * Math.min(sx,sy) / Math.min(sx,sy);
  dpr = (window.devicePixelRatio||1) * sx;
}
window.addEventListener("resize", function(){ fitTransform(); });
function fitTransform(){
  const frame=document.getElementById("frame");
  const r=frame.getBoundingClientRect();
  const pr=Math.min(2, window.devicePixelRatio||1);
  canvas.width=Math.floor(r.width*pr);
  canvas.height=Math.floor(r.height*pr);
  const sx=r.width/W, sy=r.height/H;
  dpr = pr * sx;
}

let last=0;
function loop(t){
  const dt=Math.min(0.033, (t-last)/1000 || 0.016); last=t;
  if(G.state==="title" || G.state==="hero") G.time+=dt;
  update(dt);
  const frame=document.getElementById("frame");
  const r=frame.getBoundingClientRect();
  const pr=Math.min(2, window.devicePixelRatio||1);
  if(canvas.width !== Math.floor(r.width*pr) || canvas.height !== Math.floor(r.height*pr)){
    canvas.width=Math.floor(r.width*pr); canvas.height=Math.floor(r.height*pr);
  }
  const s=Math.min(r.width/W, r.height/H);
  const ox=(r.width-W*s)/2, oy=(r.height-H*s)/2;
  ctx.setTransform(pr*s, 0, 0, pr*s, ox*pr, oy*pr);
  render();
  requestAnimationFrame(loop);
}

$("btnStart").onclick=function(){ ensureAudio(); startHeroSelect(); };
$("btnEnter").onclick=function(){ ensureAudio(); startRun(); };
$("btnAgain").onclick=function(){ show("ovTitle"); G.state="title"; };
$("portalBtn").onclick=function(){ if(G.state==="play") enterPortal(); };

requestAnimationFrame(loop);
})();

</script>
